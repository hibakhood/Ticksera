<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TICKSERA">
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="ts-sheen" cx="0.22" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed ground: the mask (circle, squircle, rounded) crops this edge -->
  <rect x="0" y="0" width="512" height="512" fill="url(#ts-bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#ts-sheen)"/>
  <!-- Mark scaled to 78% and centred: stays inside the 80% safe zone -->
  <g transform="translate(56.32 56.32) scale(6.24)">
    <path d="M18 42 L24 48" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M36 46 L52 26" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"/>
  </g>
</svg>
